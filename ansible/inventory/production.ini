[all:vars]
ansible_user=ubuntu
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
cluster_name=nginx-to-gateway-cluster

# ==========================================
# Control Plane Nodes (1x Talos)
# ==========================================
[control_plane]
talos-cp-1 ansible_host=x.x.x.130 talos_node=true

# ==========================================
# Worker Nodes (2x Talos)
# ==========================================
[workers]
talos-worker-1 ansible_host=x.x.x.132 talos_node=true
talos-worker-2 ansible_host=x.x.x.133 talos_node=true

# ==========================================
# Observability Node (1x Ubuntu)
# ==========================================
[observability]
observability-ubuntu ansible_host=x.x.x.131 os_type=ubuntu talos_node=false

[observability:vars]
# Prometheus configuration
prometheus_version=v2.50.0
prometheus_port=9090

# Grafana configuration
grafana_version=10.4.0
grafana_port=3000
grafana_admin_user=admin
grafana_admin_password=admin123

# Loki configuration
loki_version=v3.0.0
loki_port=3100

# Alertmanager
alertmanager_version=v0.27.0
alertmanager_port=9093

# ==========================================
# Kubernetes Groupes
# ==========================================
[kubernetes:children]
control_plane
workers

[kubernetes:vars]
cluster_name=nginx-to-gateway-cluster
cluster_endpoint=https://x.x.x.130:6443
kubeconfig_path=~/.kube/config

# Gateway API Configuration
gateway_api_version=v1.2.1
envoy_gateway_version=v1.2.2

# Applications
nginx_ingress_version=4.11.3
demo_app_image=nginx:alpine
